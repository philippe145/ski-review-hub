<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026/27 Alpine Ski Review Hub & Guide</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-modal: #1e293b;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --tag-east: #0284c7;
      --tag-alps: #10b981;
      --tag-race: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 30px; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
    header h1 { font-size: 2.2rem; color: var(--text-main); margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 1rem; }

    /* Controls & Filters */
    .controls { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { background: #0f172a; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500; transition: all 0.2s ease; }
    .btn:hover, .btn.active { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }
    .search-input { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 20px; width: 250px; outline: none; }
    .search-input:focus { border-color: var(--accent-blue); }

    /* Ski Grid */
    .ski-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .ski-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease; display: flex; flex-direction: column; justify-content: space-between; }
    .ski-card:hover { transform: translateY(-4px); border-color: var(--accent-blue); }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .brand-name { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .ski-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .category-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 12px; color: #fff; font-weight: 600; text-transform: uppercase; }
    .badge-east { background: var(--tag-east); }
    .badge-alps { background: var(--tag-alps); }
    .badge-race { background: var(--tag-race); }

    .card-body p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); pt: 12px; margin-top: 12px; font-size: 0.85rem; }
    .waist-tag { font-weight: 600; color: var(--accent-blue); }
    .sources-count { color: var(--text-muted); }

    /* Modal Styling */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: var(--bg-modal); border: 1px solid var(--border-color); border-radius: 16px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; }
    .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; }
    .close-btn:hover { color: var(--text-main); }

    .modal-title-area { margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
    .modal-title { font-size: 1.8rem; color: var(--text-main); }
    .modal-subtitle { color: var(--accent-blue); font-weight: 600; }

    .specs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .spec-item { font-size: 0.9rem; }
    .spec-label { color: var(--text-muted); font-size: 0.8rem; display: block; }
    .spec-value { color: var(--text-main); font-weight: 600; }

    .review-section { margin-bottom: 20px; }
    .review-section h3 { font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    .pro-con-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .pro-box, .con-box { padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    .pro-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); }
    .con-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }
    .pro-box h4 { color: #10b981; margin-bottom: 5px; }
    .con-box h4 { color: #ef4444; margin-bottom: 5px; }

    .sources-list { font-size: 0.85rem; color: var(--text-muted); background: #0f172a; padding: 10px 15px; border-radius: 8px; }
  </style>
</head>
<body>

    <p>Grounded Multi-Source Reviews & Specs Across 15 Global Publishers</p>
  </header>

      <button class="btn" onclick="filterSkis('race')">3) Fast & Advanced Skiers</button>
    </div>
    <input type="text" class="search-input" id="searchInput" placeholder="Search ski model or brand..." onkeyup="searchSkis()">
  </div>

  <div class="ski-grid" id="skiGrid"></div>
</div>

    <div class="pro-con-grid">

    <div class="sources-list" id="modalSources"></div>
  </div>
</div>

  // Render Ski Cards
  function renderSkis(data) {
    const grid = document.getElementById('skiGrid');
    grid.innerHTML = '';
    
    data.forEach(ski => {
      let badgeClass = 'badge-east';
      if(ski.categoryKey === 'alps') badgeClass = 'badge-alps';
      if(ski.categoryKey === 'race') badgeClass = 'badge-race';

      const card = document.createElement('div');
      card.className = 'ski-card';
      card.onclick = () => openModal(ski.id);

      card.innerHTML = `
        <div>
          <div class="card-header">
            <span class="brand-name">${ski.brand}</span>
            <span class="category-badge ${badgeClass}">${ski.categoryKey}</span>
          </div>
          <h3 class="ski-title">${ski.model}</h3>
          <p class="card-body">${ski.shortDesc}</p>
        </div>
        <div class="card-footer">
          <span class="waist-tag">Waist: ${ski.waist}</span>
          <span class="sources-count">Click for Review & Specs</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Filter Function
  function filterSkis(category) {
    document.querySelectorAll('.filter-buttons .btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (category === 'all') {
      renderSkis(skisData);
    } else {
      const filtered = skisData.filter(s => s.categoryKey === category);
      renderSkis(filtered);
    }
  }

  // Search Function
  function searchSkis() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = skisData.filter(s => 
      s.model.toLowerCase().includes(query) || 
      s.brand.toLowerCase().includes(query) ||
      s.categoryName.toLowerCase().includes(query)
    );
    renderSkis(filtered);
  }

  // Open Modal with Full Ski Info
  function openModal(id) {
    const ski = skisData.find(s => s.id === id);
    if (!ski) return;

    document.getElementById('modalBrand').innerText = ski.brand;
    document.getElementById('modalTitle').innerText = ski.model;
    document.getElementById('modalCategory').innerText = ski.categoryName;

    document.getElementById('modalSpecs').innerHTML = `
      <div class="spec-item"><span class="spec-label">Waist Width</span><span class="spec-value">${ski.waist}</span></div>
      <div class="spec-item"><span class="spec-label">Wood Core</span><span class="spec-value">${ski.core}</span></div>
      <div class="spec-item"><span class="spec-label">Titanal / Metal</span><span class="spec-value">${ski.titanaL}</span></div>
      <div class="spec-item"><span class="spec-label">Plate / System</span><span class="spec-value">${ski.interface}</span></div>
      <div class="spec-item"><span class="spec-label">Turn Radius</span><span class="spec-value">${ski.radius}</span></div>
    `;

    document.getElementById('modalReview').innerText = ski.aggregatedReview;
    document.getElementById('modalPros').innerText = ski.pros;
    document.getElementById('modalCons').innerText = ski.cons;
    document.getElementById('modalBestFor').innerText = ski.bestFor;
    document.getElementById('modalSources').innerText = "Publisher Coverage: " + ski.sources;

    document.getElementById('skiModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('skiModal').style.display = 'none';
  }

  // Close modal on click outside
  window.onclick = function(event) {
    const modal = document.getElementById('skiModal');
    if (event.target === modal) {
      closeModal();
    }
  }

  // Initial Load
  renderSkis(skisData);
</script>

</body>
</html>
